<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz | MANDU'ARÃ</title>
  <meta name="description" content="Respondé preguntas de historia y poné a prueba lo aprendido en clase.">
  <meta name="theme-color" content="#1b2430">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="pagina-quiz">
  <nav class="navbar navbar-dark barra">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="assets/img/logo.png" alt="" width="36" height="36">
        <span>MANDU'ARÃ</span>
      </a>
      <a class="btn btn-outline-light btn-sm" href="index.html#niveles">
        <i class="bi bi-grid-3x3-gap" aria-hidden="true"></i> Niveles
      </a>
    </div>
  </nav>

  <main class="container py-4 py-md-5">
    <section class="tablero mx-auto" aria-live="polite">
      <header class="tablero-encabezado">
        <div>
          <h1 id="nivel-titulo" class="h5 mb-0">Cargando…</h1>
          <p id="nivel-subtitulo" class="text-body-secondary small mb-0"></p>
        </div>
        <span id="puntaje" class="badge text-bg-success fs-6">0 correctas</span>
      </header>

      <div class="d-flex justify-content-between small text-body-secondary mt-3 mb-1">
        <span id="progreso">Pregunta 1</span>
        <span class="d-none d-md-inline">Atajos: teclas 1–4 · A = ayuda</span>
      </div>
      <div class="progress" role="progressbar" aria-label="Progreso del quiz" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0" style="height: 8px">
        <div id="progreso-barra" class="progress-bar" style="width: 0%"></div>
      </div>

      <div class="tarjeta-pregunta">
        <p id="pregunta" class="pregunta" tabindex="-1">Cargando preguntas…</p>
        <button id="btn-ayuda" type="button" class="btn btn-outline-primary btn-sm" hidden>
          <i class="bi bi-lightbulb" aria-hidden="true"></i> Ayuda
        </button>
      </div>

      <div id="opciones" class="opciones"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js" integrity="sha384-F8SYeBSrTVPFojwQeAD1UQo0dI5CKJOzc992kU0M/q72tnFcDlxHwbkiw8GLrXd8" crossorigin="anonymous"></script>
  <script src="assets/js/niveles.js"></script>
  <script src="assets/js/quiz.js"></script>
</body>
</html>
